<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | AI System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head><body style="background:linear-gradient(135deg,#003366,#1F5C99);min-height:100vh;">
<div class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg" style="width:420px;border-radius:16px;border:none;">
    <div class="card-body p-5">
      <div class="text-center mb-4"><i class="fa fa-user-plus fa-3x" style="color:#003366;"></i>
        <h5 class="fw-bold mt-2" style="color:#003366;">Create Account</h5></div>
      {% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}
        <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>{% endfor %}{% endwith %}
      <form method="POST">
        <div class="mb-3"><label class="form-label fw-semibold">Username *</label><input type="text" name="username" class="form-control" required></div>
        <div class="mb-3"><label class="form-label fw-semibold">Email *</label><input type="email" name="email" class="form-control" required></div>
        <div class="mb-4"><label class="form-label fw-semibold">Password *</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-primary w-100 fw-bold" style="background:#003366;border-color:#003366;">Register</button>
      </form>
      <div class="text-center mt-3"><a href="{{ url_for('auth.login') }}" class="small">Back to Login</a></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
